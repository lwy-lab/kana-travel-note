travel['도움 요청'] = travel['숙소·도움'];
delete travel['숙소·도움'];
for (const [category, phrases] of Object.entries(additionalTravel)) {
 (travel[category] ??= []).push(...phrases);
}
const travelOrder = ['기본 인사', '공항·비행기', '교통·길 찾기', '호텔', '식당', '카페·편의점', '쇼핑', '관광·사진', '도움 요청'];
const panel=document.querySelector('#panel');
const items=(row,script)=>Array.from(row[script==='h'?1:2],(char,i)=>[char,row[3].split(' ')[i]]);
let quizGroup='전체 상황', showPronunciation=false;
let page='h', group='기본 인사', extended=false, script='h', question, selected, score=0, total=0, previous;
const pill=(value,label,active,action)=>'<button class="pill" data-'+action+'="'+value+'" aria-pressed="'+active+'">'+label+'</button>';
function shuffle(list){const copy=[...list];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function next(){
 if(script==='travel'){
  const pool=quizGroup==='전체 상황'?Object.values(travel).flat():travel[quizGroup];
  const [char,pronunciation,reading]=shuffle(pool.filter(([char])=>char!==previous))[0];
  const distractors=[...new Set(pool.map(([, , meaning])=>meaning))].filter(meaning=>meaning!==reading);
  question={char,pronunciation,reading,options:shuffle([reading,...shuffle(distractors).slice(0,3)])};
  previous=char;selected=undefined;return;
 }
 const pool=rows.flatMap(row=>items(row,script)).filter(([char])=>char!=='·');
 const [char,reading]=shuffle(pool.filter(([char])=>char!==previous))[0];
 previous=char;question={char,reading,options:shuffle([reading,...shuffle([...new Set(pool.map(([,sound])=>sound))].filter(sound=>sound!==reading)).slice(0,3)])};selected=undefined;
}
function render(){
 document.querySelectorAll('[data-page]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.page===page));
 if(page==='travel'){
 panel.innerHTML='<h2>상황별 여행 회화</h2><p class="muted">여행 회화 92문장 · 상황을 골라 한글 발음과 한국어 뜻을 확인하세요.</p><div class="controls">'+travelOrder.map(key=>pill(key,key,key===group,'group')).join('')+'</div><div class="cards">'+travel[group].map(([ja,ko,meaning])=>'<article class="card"><strong lang="ja">'+ja+'</strong><p><b>'+ko+'</b></p><small>'+meaning+'</small></article>').join('')+'</div>';
 return;
 }
 if(page==='quiz'){
 if(!question)next();
 const conversation=script==='travel';
 const categories=['전체 상황',...travelOrder];
 const filter=conversation?'<label>상황 <select id="quiz-group">'+categories.map(category=>'<option'+(category===quizGroup?' selected':'')+'>'+category+'</option>').join('')+'</select></label>':'';
 const feedback=selected===undefined?(conversation?'이 문장의 뜻은 무엇일까요?':'이 글자는 어떻게 읽을까요?'):
 (selected===question.reading?'정답이에요!':'정답을 확인해 보세요.')+'<br><strong>'+question.reading+'</strong>';
 panel.innerHTML='<div class="quiz"><h2>'+(conversation?'여행 회화 뜻 맞히기':'한글 발음 맞히기')+'</h2><div class="controls options">'+pill('h','히라가나',script==='h','script')+pill('k','가타카나',script==='k','script')+pill('travel','여행 회화',conversation,'script')+'</div>'+filter+'<p class="muted">정답 '+score+' / '+total+'</p><p class="'+(conversation?'sentence':'big')+'" lang="ja">'+question.char+'</p>'+(conversation?'<label><input id="quiz-pronunciation" type="checkbox" '+(showPronunciation?'checked':'')+' aria-controls="pronunciation-hint"> 한글 발음 보기</label><p id="pronunciation-hint" '+(showPronunciation?'':'hidden')+'>'+question.pronunciation+'</p>':'')+'<div class="controls options">'+question.options.map((answer,index)=>'<button class="pill option" data-answer="'+index+'" '+(selected!==undefined?'disabled':'')+'>'+answer+'</button>').join('')+'</div><p class="notice" role="status">'+feedback+'</p>'+(selected!==undefined?'<button class="pill primary" data-next>다음 문제</button>':'')+'</div>';
 return;
 }
 panel.innerHTML='<h2>'+(page==='h'?'히라가나':'가타카나')+'</h2><p class="muted">글자를 눌러 발음을 확인하세요. 기본 글자는 46자예요.</p><div class="controls">'+pill('basic','기본 46자',!extended,'set')+pill('extra','탁음·반탁음',extended,'set')+'</div><p class="notice" id="reading" role="status">글자를 선택해 보세요.</p><div class="grid">'+(extended?extra:rows).map(row=>'<div class="row-label">'+row[0]+'</div>'+items(row,page).map(([char,sound])=>char==='·'?'<span></span>':'<button class="tile" data-char="'+char+'" data-sound="'+sound+'" aria-pressed="false"><strong lang="ja">'+char+'</strong><small>'+sound+'</small></button>').join('')).join('')+'</div>';
}
document.addEventListener('change',event=>{
 if(event.target.id==='quiz-pronunciation'){
  showPronunciation=event.target.checked;
  panel.querySelector('#pronunciation-hint').hidden=!showPronunciation;
  return;
 }
 if(event.target.id!=='quiz-group')return;
 quizGroup=event.target.value;score=0;total=0;previous=undefined;
 next();render();panel.querySelector('#quiz-group').focus();
});
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 const data=button.dataset;
 if(data.page){page=data.page;render();return}
 if(data.group){group=data.group;render();panel.querySelector('[aria-pressed=true]').focus();return}
 if(data.set){extended=data.set==='extra';render();panel.querySelector('[aria-pressed=true]').focus();return}
 if(data.char){panel.querySelectorAll('.tile[aria-pressed=true]').forEach(tile=>tile.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');document.querySelector('#reading').textContent=data.char+' · '+data.sound+('をヲ'.includes(data.char)?' (조사로 쓰일 때)':'');return}
 if(data.script){if(script!==data.script){script=data.script;score=0;total=0;next();render();panel.querySelector('[aria-pressed=true]').focus()}return}
 if(data.answer&&selected===undefined){selected=question.options[Number(data.answer)];total++;if(selected===question.reading)score++;render();panel.querySelector('[data-next]').focus();return}
 if(data.next!==undefined){next();render();panel.querySelector('[data-answer]').focus()}
});
render();
</script></body></html>
